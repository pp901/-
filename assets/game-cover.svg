<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="35%" stop-color="#2d1b4e"/>
      <stop offset="65%" stop-color="#c32723"/>
      <stop offset="100%" stop-color="#f4c76a"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#ffe066"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffaa33"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
    <filter id="starGlow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- Spark particles with SMIL animation -->
  <circle cx="120" cy="50" r="2.5" fill="#ffd700" opacity="0.85">
    <animate attributeName="cy" values="50;42;50" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="35" r="1.8" fill="#fff" opacity="0.6">
    <animate attributeName="cy" values="35;28;35" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="55" r="2" fill="#ffd700" opacity="0.7">
    <animate attributeName="cy" values="55;47;55" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="40" r="2.2" fill="#fff" opacity="0.55">
    <animate attributeName="cy" values="40;33;40" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="70" cy="90" r="1.5" fill="#ffd700" opacity="0.5">
    <animate attributeName="cy" values="90;83;90" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="65" r="1.8" fill="#ffd700" opacity="0.55">
    <animate attributeName="cy" values="65;58;65" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Mountains -->
  <path d="M0 300l42-48 46-30 54-58 52-18 60-70 56-10 68-50 64 8 72-35 66 18 68-25 58 30 36-15 32 12" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  <path d="M0 320l38-40 48-22 50-48 52-12 58-58 62-8 64-38 68 12 66-24 62 20 56-12 42 26 28-8 26 10" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Emblem rings -->
  <circle cx="400" cy="175" r="85" fill="none" stroke="rgba(255,224,102,0.28)" stroke-width="2">
    <animateTransform attributeName="transform" type="rotate" from="0 400 175" to="360 400 175" dur="30s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="175" r="95" fill="none" stroke="rgba(255,224,102,0.12)" stroke-width="1" stroke-dasharray="6 4">
    <animateTransform attributeName="transform" type="rotate" from="360 400 175" to="0 400 175" dur="20s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="175" r="36" fill="url(#ember)" filter="url(#starGlow)" opacity="0.9">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Star -->
  <polygon points="400,147 414,167 437,167 420,181 427,202 400,189 373,202 380,181 363,167 386,167" fill="#1a0a2e"/>

  <!-- Icon cards -->
  <g transform="translate(248,185)">
    <animateTransform attributeName="transform" type="translate" values="248,185;248,177;248,185" dur="3s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="36" height="36" rx="7" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
    <path d="M10 10h8l2 2v12a2 2 0 01-2 2H10a2 2 0 01-2-2V12a2 2 0 012-2z" fill="none" stroke="rgba(255,224,102,0.7)" stroke-width="1.3"/>
    <line x1="14" y1="16" x2="22" y2="16" stroke="rgba(255,255,255,0.55)" stroke-width="1.2"/>
    <line x1="14" y1="19" x2="20" y2="19" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  </g>
  <g transform="translate(516,195)">
    <animateTransform attributeName="transform" type="translate" values="516,195;516,188;516,195" dur="2.8s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="36" height="36" rx="7" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
    <path d="M18 8l-3 4h2.5l-1 6 3.5-5H17l1-5z" fill="none" stroke="rgba(255,107,53,0.7)" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="400" y="342" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="54" font-weight="900" fill="url(#titleGrad)" letter-spacing="8" filter="url(#shadow)">井冈山保卫战</text>
  <text x="400" y="388" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="rgba(255,255,255,0.78)" letter-spacing="6">军民一体 · 人民力量生生不息</text>

  <!-- Tags -->
  <g transform="translate(400,434)" font-family="sans-serif" font-size="12" text-anchor="middle">
    <rect x="-216" y="-15" width="66" height="27" rx="13.5" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="-183" y="3" fill="rgba(255,255,255,0.8)">塔防</text>
    <rect x="-138" y="-15" width="66" height="27" rx="13.5" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="-105" y="3" fill="rgba(255,255,255,0.8)">策略</text>
    <rect x="-60" y="-15" width="66" height="27" rx="13.5" fill="rgba(255,224,102,0.22)" stroke="rgba(255,224,102,0.35)" stroke-width="1.2"/>
    <text x="-27" y="3" fill="#ffe066" font-weight="700">10 关</text>
    <rect x="18" y="-15" width="66" height="27" rx="13.5" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="51" y="3" fill="rgba(255,255,255,0.8)">历史</text>
    <rect x="96" y="-15" width="66" height="27" rx="13.5" fill="rgba(255,255,255,0.13)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="129" y="3" fill="rgba(255,255,255,0.8)">图鉴</text>
  </g>

  <!-- Bottom dots -->
  <g opacity="0.25">
    <circle cx="160" cy="478" r="1.5" fill="#ffd700">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="475" r="1" fill="#fff">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="473" r="1.5" fill="#ffd700">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
