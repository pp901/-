<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f1714"/>
      <stop offset="55%" stop-color="#9e241d"/>
      <stop offset="100%" stop-color="#e0b36d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4c76a"/>
      <stop offset="100%" stop-color="#ffe7a8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Mountains -->
  <path d="M0 340l40-80 50-40 60-90 55-30 70-100 65-20 80-80 75-15 90-60 85 10 75-30 55 40" fill="none" stroke="rgba(255,231,168,0.18)" stroke-width="1.5"/>
  <path d="M0 370l35-70 45-30 55-80 60-20 65-85 70-15 75-70 80-10 85-45 80 15 70-20 45 35" fill="none" stroke="rgba(255,231,168,0.1)" stroke-width="1"/>
  <!-- Emblem circle -->
  <circle cx="400" cy="190" r="110" fill="none" stroke="rgba(244,199,106,0.4)" stroke-width="2"/>
  <circle cx="400" cy="190" r="100" fill="none" stroke="rgba(244,199,106,0.15)" stroke-width="1"/>
  <circle cx="400" cy="190" r="28" fill="url(#gold)" opacity="0.9"/>
  <!-- Star -->
  <polygon points="400,168 407,183 423,183 411,192 416,208 400,199 384,208 389,192 377,183 393,183" fill="#741713" filter="url(#glow)"/>
  <!-- Title -->
  <text x="400" y="340" text-anchor="middle" font-family="STKaiti,KaiTi,serif" font-size="52" font-weight="900" fill="url(#gold)" letter-spacing="12">井冈山保卫战</text>
  <text x="400" y="380" text-anchor="middle" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="18" fill="rgba(255,245,220,0.75)" letter-spacing="8">军民一体 · 人民力量生生不息</text>
  <!-- Bottom bar -->
  <rect x="200" y="420" width="400" height="2" fill="rgba(244,199,106,0.3)" rx="1"/>
  <text x="400" y="460" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="rgba(255,245,220,0.55)" letter-spacing="4">STRATEGY · TOWER DEFENSE · 10 WAVES</text>
</svg>
